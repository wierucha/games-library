<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Games" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>wierucha's Games Library</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1 class="logo">wierucha's Games Library</h1>
        <div class="header-actions">
          <div class="stats" id="stats">—</div>
          <a href="add-game.html" class="add-game-link" title="Add or edit games" aria-label="Add or edit games">+</a>
          <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">☾</button>
        </div>
      </div>

      <div class="platform-tabs" id="platformTabs" role="group" aria-label="Platform"></div>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="search" id="search" placeholder="Search games, developers or notes…" aria-label="Search games, developers or notes" autocomplete="off" />
        <button class="clear-btn" id="clearSearch" type="button" aria-label="Clear search">×</button>
      </div>

      <div class="filters">
        <select id="mediaFilter" class="filter-select" aria-label="Physical or digital">
          <option value="both">Physical + Digital</option>
          <option value="physical">Physical only</option>
          <option value="digital">Digital only</option>
        </select>

        <select id="regionFilter" class="filter-select" aria-label="Region">
          <option value="all">All Regions</option>
        </select>

        <select id="ratingFilter" class="filter-select" aria-label="Rating">
          <option value="all">All Ratings</option>
          <option value="Overwhelmingly Positive">Overwhelmingly Positive</option>
          <option value="Very Positive">Very Positive</option>
          <option value="Mostly Positive">Mostly Positive</option>
          <option value="Mixed">Mixed</option>
          <option value="Mostly Negative">Mostly Negative</option>
          <option value="Very Negative">Very Negative</option>
          <option value="Overwhelmingly Negative">Overwhelmingly Negative</option>
          <option value="No user reviews">No Reviews</option>
        </select>

        <select id="yearFilter" class="filter-select" aria-label="Release year">
          <option value="all">All Years</option>
        </select>

        <select id="sortBy" class="filter-select" aria-label="Sort by">
          <option value="name">Name A→Z</option>
          <option value="name-desc">Name Z→A</option>
          <option value="year-desc">Newest First</option>
          <option value="year">Oldest First</option>
          <option value="score-desc">Highest Score</option>
          <option value="score">Lowest Score</option>
        </select>
      </div>
    </header>

    <div class="results-bar">
      <span id="resultsCount" role="status" aria-live="polite">Loading…</span>
      <button id="exportBtn" class="export-btn" type="button" title="Export current list as CSV">Export CSV</button>
    </div>

    <main class="game-list" id="gameList"></main>

    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-icon" aria-hidden="true">🔍</div>
      <p>No games match your filters</p>
      <button id="resetFilters" class="btn" type="button">Reset filters</button>
    </div>
  </div>

  <button type="button" id="scrollTop" class="scroll-top" aria-label="Back to top" title="Back to top" hidden>↑</button>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
